name: Sync full portfolio website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_portfolio.py
      - scripts/portfolio-paths.b64
      - .github/workflows/sync-portfolio.yml
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download every packaged public portfolio file
        run: python3 scripts/sync_portfolio.py
      - name: Commit complete public portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Sync complete portfolio from verified public Netlify deployment"
            git push
          fi
