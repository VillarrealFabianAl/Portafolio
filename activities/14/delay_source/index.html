<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Status Presentation</title><style>
:root{--ink:#211b52;--muted:#656083;--indigo:#4038ba;--lav:#f2f0ff;--line:#d9d5ff;--green:#14724e;--pink:#eb6e91}*{box-sizing:border-box}body{margin:0;min-width:320px;background:linear-gradient(135deg,#fbfaff,#efedff);color:var(--ink);font-family:Calibri,Arial,sans-serif}button{font:inherit}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Arial,Calibri,Arial,sans-serif}.shell{width:min(1240px,calc(100% - 32px));min-height:850px;margin:0 auto;padding:38px 0 50px}.hero{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:20px}.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 9px;color:var(--indigo);font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.spark{width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:14px 0 0 #8279ed}h1{margin:0;font-size:clamp(33px,4vw,52px);letter-spacing:-.055em}.hero p:last-child{max-width:700px;margin:12px 0 0;color:var(--muted);font-size:17px;line-height:1.45}.progress{display:flex;gap:7px;align-items:center}.progress i{width:27px;height:8px;border-radius:99px;background:#d5d1f5}.progress i.current{width:48px;background:var(--indigo)}.progress i.done{background:var(--green)}.stage{position:relative;overflow:hidden;min-height:655px;padding:clamp(25px,4vw,44px);border:1px solid var(--line);border-radius:31px;background:radial-gradient(circle at 96% 8%,rgba(115,105,250,.18),transparent 27%),linear-gradient(135deg,#f1f0ff,#fff);box-shadow:0 24px 52px rgba(45,37,142,.1)}.stage:after{content:'';position:absolute;right:-92px;top:-95px;width:280px;height:280px;border:29px solid rgba(115,105,250,.11);border-radius:50%}.slide{position:relative;z-index:1;animation:slide-in .4s cubic-bezier(.2,.8,.2,1) both}.slide[hidden]{display:none}.slide-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.slide-head h2{margin:0;font-size:clamp(32px,4vw,49px);letter-spacing:-.055em}.state-kicker{display:inline-flex;align-items:center;gap:7px;margin:0 0 9px;padding:7px 10px;border-radius:99px;color:#fff;background:var(--indigo);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.state-icon{display:grid;place-items:center;width:64px;height:64px;margin-bottom:13px;border:5px solid #fff;border-radius:50%;color:#fff;background:linear-gradient(135deg,#3b32c1,#746bfa);font-size:29px;box-shadow:0 12px 22px rgba(60,52,181,.22)}.slide-head p{margin:8px 0 0;color:var(--muted);font-size:16px}.slide-count{padding:10px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--muted);font-size:13px;font-weight:800}.content{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;margin-top:26px}.banner-panel{display:flex;flex-direction:column;min-height:310px;overflow:hidden;border:1px solid #d2ceff;border-radius:22px;background:#fff;box-shadow:0 9px 20px rgba(45,37,142,.06)}.banner-button{position:relative;display:block;flex:1;width:100%;padding:20px;border:0;background:#faf9ff;cursor:zoom-in}.banner-button img{display:block;width:100%;border-radius:8px;box-shadow:0 7px 14px rgba(45,37,142,.11)}.open-cue{position:absolute;right:27px;top:38px;display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:99px;color:#fff;background:var(--indigo);font-size:12px;font-weight:900;box-shadow:0 7px 14px rgba(64,56,186,.22);transition:.2s ease}.banner-button:hover .open-cue,.banner-button:focus-visible .open-cue{transform:translateY(-2px)}.banner-caption{display:flex;align-items:center;gap:9px;margin:0;padding:14px 18px;border-top:1px solid #e0ddff;color:var(--muted);font-size:13px;font-weight:700;line-height:1.35}.caption-icon{display:grid;place-items:center;flex:0 0 auto;width:28px;height:28px;border:1px solid var(--indigo);border-radius:50%;color:var(--indigo)}.detail-area{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}.waiting{display:grid;place-items:center;grid-column:1/-1;min-height:310px;padding:28px;border:1px dashed #c5c0ff;border-radius:20px;background:rgba(255,255,255,.54);color:var(--muted);text-align:center;font-size:17px;font-weight:700;line-height:1.45}.waiting span{display:grid;place-items:center;width:53px;height:53px;margin:0 auto 14px;border-radius:50%;color:var(--indigo);background:#eeedff;font-size:24px}.detail-card{min-height:147px;padding:20px;border:1px solid #d2ceff;border-radius:20px;background:#fff;opacity:0;transform:translateY(17px);animation:card-in .5s cubic-bezier(.2,.8,.2,1) forwards}.detail-card.decision{animation-delay:.65s}.detail-card.action{grid-column:1/-1;min-height:92px;animation-delay:1.3s;background:linear-gradient(115deg,#f9f8ff,#f2fffa);border-color:#b7e5d2}.detail-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.detail-icon{display:grid;place-items:center;width:35px;height:35px;border:2px solid var(--indigo);border-radius:50%;color:var(--indigo);font-weight:900}.detail-card h3{margin:0;font-size:18px;letter-spacing:-.02em}.detail-card p:last-child{margin:0;color:var(--muted);font-size:16px;font-weight:700;line-height:1.45}.detail-card.decision p:last-child{color:var(--indigo)}.detail-card.action p:last-child{color:#176447}.footer{display:flex;justify-content:flex-end;gap:16px;align-items:center;margin-top:20px;padding-top:19px;border-top:1px solid var(--line)}.next{min-width:205px;padding:15px 20px;border:0;border-radius:14px;color:#fff;background:linear-gradient(100deg,#372fb7,#574cf0);font-weight:900;cursor:pointer;box-shadow:0 9px 19px rgba(64,56,186,.25);transition:.2s ease}.next:hover:not(:disabled),.next:focus-visible:not(:disabled){transform:translateY(-2px);outline:3px solid rgba(64,56,186,.24);outline-offset:3px}.next:disabled{cursor:not-allowed;color:#7c7890;background:#dedce7;box-shadow:none}.intro,.complete{display:grid;place-items:center;min-height:560px;text-align:center}.intro>div,.complete>div{max-width:640px}.orb{display:grid;place-items:center;width:82px;height:82px;margin:0 auto 22px;border-radius:50%;color:#fff;background:linear-gradient(135deg,#3b32c1,#746bfa);font-size:35px;box-shadow:0 14px 26px rgba(60,52,181,.22)}.intro h2,.complete h2{margin:0 0 12px;font-size:46px;letter-spacing:-.06em}.intro p,.complete p{margin:0;color:var(--muted);font-size:19px;line-height:1.5}.intro .next{margin-top:24px}.lightbox[hidden]{display:none}.lightbox{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:25px;background:rgba(18,12,55,.76);backdrop-filter:blur(5px)}.lightbox-box{width:min(100%,1000px);padding:20px;border-radius:24px;background:#fff;box-shadow:0 28px 70px rgba(0,0,0,.33);animation:slide-in .3s ease both}.lightbox-top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:15px}.lightbox-top p{margin:0;font-weight:900}.close{display:grid;place-items:center;width:39px;height:39px;border:0;border-radius:50%;color:#fff;background:var(--indigo);font-size:22px;cursor:pointer}.lightbox img{display:block;width:100%;border-radius:12px;border:1px solid var(--line)}.lightbox small{display:block;margin-top:11px;color:var(--muted)}@keyframes slide-in{from{opacity:0;transform:translateY(14px) scale(.987)}to{opacity:1;transform:none}}@keyframes card-in{to{opacity:1;transform:none}}@media(max-width:850px){.hero{display:block}.progress{margin-top:22px}.content{grid-template-columns:1fr}.detail-area{min-height:0}.waiting{min-height:170px}.banner-panel{min-height:240px}}@media(max-width:560px){.shell{width:min(100% - 16px,560px);min-height:980px;padding:20px 0 32px}.stage{min-height:760px;padding:20px;border-radius:23px}.slide-head{display:block}.slide-count{display:inline-block;margin-top:16px}.detail-area{grid-template-columns:1fr}.detail-card.action{grid-column:auto}.footer .next{width:100%}.banner-button{padding:13px}.open-cue{right:20px;top:26px}.intro,.complete{min-height:620px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.complete p + p{margin-top:18px}.complete strong{color:var(--ink);font-family:Arial,Calibri,Arial,sans-serif}
</style><style id="course-font-standard">html,body,button,input,select,textarea{font-family:Calibri,Arial,sans-serif}h1,h2,h3,h4,h5,h6,[role="heading"],.title,.headline,[class*="-title"],[class*="_title"],.question-prompt,.result-headline{font-family:Arial,Arial,sans-serif!important}</style></head><body><main class="shell"><header class="hero"><div><p class="eyebrow"><span class="spark" aria-hidden="true"></span>Booking update presentation</p><h1>Reading booking state</h1><p>Open each banner preview, then review the guidance that appears on the slide.</p></div><div class="progress" id="progress" aria-label="Presentation progress"></div></header><section class="stage" id="stage" aria-live="polite"></section></main><div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lightbox-title"><section class="lightbox-box"><div class="lightbox-top"><p id="lightbox-title">Banner preview</p><button class="close" id="close-preview" type="button" aria-label="Close preview">×</button></div><img id="lightbox-image" src="" alt=""><small>Close the preview to reveal the slide guidance.</small></section></div><script>
const BANNERS=[{"state": "New", "icon": "◇", "meaning": "Read the participant request and compare it with the workshop brief before choosing an action.", "proceed": "Read the next action.", "action": "Compare the workshop brief", "image": "assets/banner-01-New.png"}, {"state": "Paused", "icon": "×", "meaning": "A required session detail is missing. Ask for the missing detail and keep the request open.", "proceed": "Read the next action.", "action": "Ask for the date", "image": "assets/banner-02-bookingupdate-ineligible.png"}, {"state": "Ready", "icon": "✓", "meaning": "The session and date match the participant request. Send the updated booking summary.", "proceed": "Read the next action.", "action": "Send summary", "image": "assets/banner-03-bookingupdate-eligible.png"}, {"state": "Completed", "icon": "✓", "meaning": "The updated summary has been sent. Review any new question as a separate request.", "proceed": "Read the next action.", "action": "Read the new question", "image": "assets/banner-04-Completed.png"}, {"state": "Unassigned", "icon": "?", "meaning": "Choose a request category so the appropriate workshop team can review it.", "proceed": "Read the next action.", "action": "Choose a category", "image": "assets/banner-05-no-banner.png"}, {"state": "Assigned", "icon": "⚑", "meaning": "A coordinator is already reviewing the request. Add relevant new details to the existing record.", "proceed": "Read the next action.", "action": "Update the existing record", "image": "assets/banner-06-Assigned.png"}];
const state={index:-1,visited:new Set(),previewed:new Set(),ready:new Set(),timer:null};const stage=document.getElementById('stage'),lightbox=document.getElementById('lightbox');function progress(){document.getElementById('progress').innerHTML=BANNERS.map((_,i)=>`<i class="${state.index===i?'current':''} ${state.visited.has(i)?'done':''}"></i>`).join('')}function intro(){stage.innerHTML=`<section class="slide intro"><div><span class="orb">✦</span><p class="eyebrow" style="justify-content:center">Guided presentation</p><h2>Read the banner before you act.</h2><p>Open each banner preview and let the slide reveal the decision guidance.</p><button class="next" id="begin" type="button">Begin presentation →</button></div></section>`;document.getElementById('begin').onclick=()=>go(0)}function slide(){let b=BANNERS[state.index],opened=state.previewed.has(state.index),ready=state.ready.has(state.index);stage.innerHTML=`<section class="slide"><div class="slide-head"><div><span class="state-icon">${b.icon}</span><p class="state-kicker">Current state · ${String(state.index+1).padStart(2,'0')} of ${String(BANNERS.length).padStart(2,'0')}</p><h2>${b.state}</h2><p>Use the current banner state before taking any booking update action.</p></div><span class="slide-count">${state.index+1} / ${BANNERS.length}</span></div><div class="content"><figure class="banner-panel"><button class="banner-button" id="open-preview" type="button"><img src="${b.image}" alt="${b.state} Booking Desk fictional banner"><span class="open-cue">⤢ Open larger</span></button><figcaption class="banner-caption"><span class="caption-icon">▣</span>Select the banner image to open its preview.</figcaption></figure><div class="detail-area">${opened?`<section class="detail-card"><div class="detail-card-head"><span class="detail-icon">i</span><h3>What this banner means</h3></div><p>${b.meaning}</p></section><section class="detail-card decision"><div class="detail-card-head"><span class="detail-icon">↗</span><h3>Can the agent proceed?</h3></div><p>${b.proceed}</p></section><section class="detail-card action"><div class="detail-card-head"><span class="detail-icon">ϟ</span><h3>Agent action</h3></div><p>${b.action}</p></section>`:`<section class="waiting"><div><span>⤢</span>Open the banner preview to reveal the guidance for this state.</div></section>`}</div></div><footer class="footer"><button class="next" id="next" type="button" ${ready?'':'disabled'}>${state.index===BANNERS.length-1?'Complete presentation':'Next banner →'}</button></footer></section>`;document.getElementById('open-preview').onclick=openPreview;document.getElementById('next').onclick=next}function go(i){state.index=i;progress();slide()}function openPreview(){let b=BANNERS[state.index];document.getElementById('lightbox-title').textContent=`${b.state} banner preview`;document.getElementById('lightbox-image').src=b.image;document.getElementById('lightbox-image').alt=`${b.state} Booking Desk banner preview`;lightbox.hidden=false;document.getElementById('close-preview').focus()}function closePreview(){lightbox.hidden=true;document.getElementById('lightbox-image').removeAttribute('src');if(!state.previewed.has(state.index)){state.previewed.add(state.index);slide();state.timer=setTimeout(()=>{state.ready.add(state.index);let nextButton=document.getElementById('next');if(nextButton)nextButton.disabled=false},1900)}}function next(){state.visited.add(state.index);if(state.index===BANNERS.length-1){progress();stage.innerHTML=`<section class="slide complete"><div><span class="orb">✓</span><p class="eyebrow" style="justify-content:center">Presentation complete</p><h2>All banner states reviewed.</h2><p>You’ve confirmed how each Booking Desk banner guides the next action.</p><p><strong>In the next lesson, you’ll learn about:</strong><br>routing label eligibility</p></div></section>`;window.parent.postMessage({type:'complete'},'*');return}go(state.index+1)}document.getElementById('close-preview').onclick=closePreview;lightbox.onclick=e=>{if(e.target===lightbox)closePreview()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!lightbox.hidden)closePreview()});progress();intro();
</script></body></html>
