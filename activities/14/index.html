<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Status Presentation</title>
  <style>
    html, body, iframe { width: 100%; min-height: 100%; margin: 0; border: 0; }
    body { background: #efedff; }
    iframe { display: block; min-height: 980px; }
  </style>
<style id="course-font-standard">html,body,button,input,select,textarea{font-family:Calibri,Arial,sans-serif}h1,h2,h3,h4,h5,h6,[role="heading"],.title,.headline,[class*="-title"],[class*="_title"],.question-prompt,.result-headline{font-family:Arial,Arial,sans-serif!important}</style></head>
<body>
  <iframe id="presentation" src="delay_source/index.html" title="Reading booking state presentation mockup"></iframe>
  <script>
    const frame = document.getElementById('presentation');
    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      window.addEventListener('message', (event) => { if (event.source === win && event.data && event.data.type === 'complete') window.parent.postMessage({type:'complete'}, '*'); });
      if (!doc || !win) return;
      const effects = doc.createElement('style');
      effects.textContent = `
        .detail-card {
          animation-duration: .9s !important;
          animation-timing-function: cubic-bezier(.16, 1, .3, 1) !important;
        }
        .detail-card.decision { animation-delay: 1.7s !important; }
        .detail-card.action { animation-delay: 3.4s !important; }
        @keyframes card-in {
          from { opacity: 0; transform: translateX(30px) scale(.96); filter: blur(4px); }
          70% { opacity: 1; }
          to { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
        }
        .detail-card.action { box-shadow: 0 14px 26px rgba(20, 114, 78, .10); }
        .state-kicker { color: #ffffff !important; }
        .state-icon svg, .detail-icon svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
      `;
      doc.head.appendChild(effects);
      const nativeSetTimeout = win.setTimeout.bind(win);
      win.setTimeout = (callback, delay, ...args) =>
        nativeSetTimeout(callback, delay === 1900 ? 5000 : delay, ...args);
      
      const icons = {
        New: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4 5.8 6v5.4c0 4.1 2.5 7.5 6.2 8.7 3.7-1.2 6.2-4.6 6.2-8.7V6L12 3.4Z"/><path d="M12 8.2v4.6M12 16h.01"/></svg>',
        'Paused': '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.2" y="10.1" width="13.6" height="9.2" rx="2"/><path d="M8.5 10.1V7.9a3.5 3.5 0 0 1 6.8-1.1M8 16l8-8"/></svg>',
        'Ready': '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.9" y="6" width="16.2" height="12" rx="2"/><path d="m5 7.4 7 5.1 7-5.1M8.2 15.1l2.3 2.3 4.8-4.7"/></svg>',
        Completed: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4 5.8 6v5.4c0 4.1 2.5 7.5 6.2 8.7 3.7-1.2 6.2-4.6 6.2-8.7V6L12 3.4Z"/><path d="m8.8 12 2.2 2.2 4.4-4.4"/></svg>',
        'Unassigned': '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.8"/><path d="m15 15 4.2 4.2M10.5 7.5v3.4M10.5 13.5h.01"/></svg>',
        Assigned: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 20.5V4.2M6.5 5.3c3.5-1.9 5.7 2 10.8-.1v8.1c-5.1 2.1-7.3-1.9-10.8.1"/><path d="m14.7 9.2 1.2 1.2 2.2-2.2"/></svg>',
        meaning: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.3"/><path d="M12 10.7v5M12 7.7h.01"/></svg>',
        decision: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="17.4" r="2"/><circle cx="17.5" cy="6.5" r="2"/><path d="M8.3 16.5c1.4-3.1 1.6-5.5 5.3-7.8"/></svg>',
        action: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13.3 3.7-7.4 9.1h4.9l-.1 7.5 7.4-9.1h-4.9l.1-7.5Z"/></svg>'
      };
      const updateIcons = () => {
        const title = doc.querySelector('.slide-head h2')?.textContent.trim();
        const stateIcon = doc.querySelector('.state-icon');
        if (stateIcon && icons[title]) stateIcon.innerHTML = icons[title];
        const cards = doc.querySelectorAll('.detail-card');
        if (cards[0]) cards[0].querySelector('.detail-icon').innerHTML = icons.meaning;
        if (cards[1]) cards[1].querySelector('.detail-icon').innerHTML = icons.decision;
        if (cards[2]) cards[2].querySelector('.detail-icon').innerHTML = icons.action;
      };
      const stage = doc.getElementById('stage'); const observer = new win.MutationObserver(() => { observer.disconnect(); updateIcons(); observer.observe(stage, {childList:true,subtree:true}); }); updateIcons(); observer.observe(stage, {childList:true,subtree:true});
    });
  </script>
</body>
</html>
